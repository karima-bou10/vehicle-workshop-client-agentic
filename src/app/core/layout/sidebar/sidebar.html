<aside class="sidebar" [class.sidebar--reduced]="reduced()">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-label="Atelier Automobile" role="img">
      <svg class="sidebar__logo-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6.8 13.2 9.2 8.5h5.6l2.4 4.7" />
        <path d="M5.2 13.2h13.6" />
        <circle cx="8.1" cy="15.7" r="1.6" />
        <circle cx="15.9" cy="15.7" r="1.6" />
        <path d="M11.1 8.5 12 6.8l.9 1.7" />
      </svg>
    </span>
    <div class="sidebar__title-block">
      <p class="sidebar__title">Atelier Automobile</p>
    </div>

    <button type="button" class="sidebar__toggle" (click)="toggleReduced()" [attr.aria-label]="t('sidebar.toggle')">
      ☰
    </button>
  </div>

  <nav class="sidebar__menu" aria-label="Navigation principale">
    <a routerLink="/dashboard" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg class="sidebar__icon-svg" viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="4" width="7" height="7" rx="1.2" />
          <rect x="13" y="4" width="7" height="5" rx="1.2" />
          <rect x="13" y="11" width="7" height="9" rx="1.2" />
          <rect x="4" y="13" width="7" height="7" rx="1.2" />
        </svg>
      </span>
      <span class="sidebar__label">{{ t('menu.dashboard') }}</span>
    </a>

    <a routerLink="/interventions" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg class="sidebar__icon-svg" viewBox="0 0 24 24" focusable="false">
          <path d="M6 6h12" />
          <path d="M6 12h9" />
          <path d="M6 18h7" />
          <circle cx="18.2" cy="12" r="2.2" />
        </svg>
      </span>
      <span class="sidebar__label">{{ t('menu.interventions') }}</span>
    </a>

    <a routerLink="/vehicules" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg class="sidebar__icon-svg" viewBox="0 0 24 24" focusable="false">
          <path d="M6.8 13.2 9.2 8.5h5.6l2.4 4.7" />
          <path d="M5.2 13.2h13.6" />
          <circle cx="8.1" cy="15.7" r="1.6" />
          <circle cx="15.9" cy="15.7" r="1.6" />
        </svg>
      </span>
      <span class="sidebar__label">{{ t('menu.vehicules') }}</span>
    </a>

    <a routerLink="/mecaniciens" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg class="sidebar__icon-svg" viewBox="0 0 24 24" focusable="false">
          <circle cx="12" cy="7.5" r="2.8" />
          <path d="M6.6 17.6c.8-2.6 2.8-4.1 5.4-4.1s4.6 1.5 5.4 4.1" />
          <path d="M4.6 12.5 3.5 11.4" />
          <path d="M19.4 12.5 20.5 11.4" />
        </svg>
      </span>
      <span class="sidebar__label">{{ t('menu.mecaniciens') }}</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <app-user-menu [reduit]="reduced()" />
  </div>
</aside>
