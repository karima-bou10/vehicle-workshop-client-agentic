<section class="edit-page" aria-labelledby="edit-title">
  <a class="back-link" [routerLink]="['/vehicules', vehicleId]">Retour au détail</a>

  @if (loading()) {
    <div class="state-panel" role="status">Chargement du véhicule...</div>
  } @else if (notFound()) {
    <div class="state-panel error-state" role="alert">Véhicule introuvable.</div>
  } @else {
    <header class="page-heading">
      <p class="eyebrow">Fiche véhicule</p>
      <h1 id="edit-title">Modifier le véhicule</h1>
      <p>Mettez à jour les informations du véhicule.</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-grid">
        <label><span>Immatriculation fictive <b aria-hidden="true">*</b></span><input type="text" formControlName="immatriculationFictive" placeholder="Ex. AB-123-CD" autocomplete="off" />@if (hasError('immatriculationFictive')) { <small>L'immatriculation est obligatoire et doit respecter le format AA-123-AA (ex. AB-123-CD).</small> }</label>
        <label><span>Marque <b aria-hidden="true">*</b></span><input type="text" formControlName="marque" />@if (hasError('marque')) { <small>La marque doit être une chaîne valide (lettres uniquement, sans chiffres ni caractères spéciaux).</small> }</label>
        <label><span>Modèle <b aria-hidden="true">*</b></span><input type="text" formControlName="modele" />@if (hasError('modele')) { <small>Le modèle doit être une chaîne valide (lettres uniquement, sans chiffres ni caractères spéciaux).</small> }</label>
        <label><span>Année <b aria-hidden="true">*</b></span><input type="number" formControlName="annee" min="1900" [max]="maxYear" />@if (hasError('annee')) { <small>L'année est obligatoire et doit être comprise entre 1900 et {{ maxYear }}.</small> }</label>
        <label><span>Kilométrage <b aria-hidden="true">*</b></span><input type="number" formControlName="kilometrage" min="0" step="1" />@if (hasError('kilometrage')) { <small>Le kilométrage est obligatoire et doit être positif.</small> }</label>
        <label><span>Client fictif <b aria-hidden="true">*</b></span><input type="text" formControlName="clientFictif" />@if (hasError('clientFictif')) { <small>Le client est obligatoire (entre 2 et 100 caractères).</small> }</label>
      </div>

      @if (error(); as message) { <p class="error-message" role="alert">{{ message }}</p> }

      <div class="actions">
        <a class="secondary" [routerLink]="['/vehicules', vehicleId]">Annuler</a>
        <button type="submit" class="primary" [disabled]="saving() || form.invalid">{{ saving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}</button>
      </div>
    </form>
  }
</section>
